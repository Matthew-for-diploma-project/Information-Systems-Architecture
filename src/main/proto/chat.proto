syntax = "proto3";
package chat;
option java_package = "rpc.generated";
option java_outer_classname = "ChatWire";

// Text commands never cross an internal container boundary.
message Request {
  enum Operation {
    UNSPECIFIED = 0;
    CONNECT = 1; DISCONNECT = 2; NOTIFICATIONS = 3; SEND = 4;
    READ = 5; ACK = 6; HISTORY = 7; STATE = 8; USERS = 9; METRICS = 10;
    BEGIN = 20; FIND_USER = 21; SAVE_USER = 22; ADD_MESSAGE = 23;
    ENQUEUE = 24; REMOVE_NOTIFICATION = 25; COMMIT = 26;
  }
  Operation operation = 1;
  optional string name = 2;
  optional string text = 3;
  optional bool enabled = 4;
  int64 message_id = 5;
  User user = 6;
  repeated string recipients = 7;
  string created_at = 8;
}
message Message {
  int64 id = 1;
  string sender = 2;
  string text = 3;
  string created_at = 4;
}
message User {
  string name = 1;
  bool online = 2;
  string last_connected = 3;
  bool notifications_enabled = 4;
}
message Metrics { int64 requests = 1; int64 notifications = 2; }
message Reply {
  enum Status { OK = 0; ARGUMENT = 1; STATE = 2; SERVER = 3; }
  Status status = 1;
  string error = 2;
  repeated Message messages = 3;
  repeated User users = 4;
  Metrics metrics = 5;
}
