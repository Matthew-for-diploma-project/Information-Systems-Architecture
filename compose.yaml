# Имя проекта сохранено для повторного использования тома БД лабораторной №4.
name: group-chat-lab4

x-app: &app
  image: group-chat-lab5-app:local
  build:
    context: .
    target: runtime
  stop_grace_period: 30s

services:
  storage:
    <<: *app
    command: [storage, /data/chat, "6002", 0.0.0.0, "${STORAGE_WORKERS:-4}"]
    volumes:
      - chat-data:/data
    networks: [data]
    healthcheck:
      test: [CMD, java, -jar, /app/chat.jar, proto-health, 127.0.0.1, "6002"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  application:
    <<: *app
    command: [application, "6001", 0.0.0.0, storage, "6002", "${APPLICATION_WORKERS:-4}"]
    networks: [backend, data]
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: [CMD, java, -jar, /app/chat.jar, proto-health, 127.0.0.1, "6001"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  server:
    <<: *app
    command: [server, "5555", 0.0.0.0, application, "6001", "${FACADE_WORKERS:-4}"]
    ports:
      - "127.0.0.1:5555:5555"
    networks: [frontend, backend]
    depends_on:
      application:
        condition: service_healthy
    healthcheck:
      test: "java -jar /app/chat.jar health 127.0.0.1 5555"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  client:
    <<: *app
    command: [client, server, "5555"]
    networks: [frontend]
    depends_on:
      server:
        condition: service_healthy
    profiles: [tools]

  tests:
    image: group-chat-lab5-tests:local
    build:
      context: .
      target: tests
    environment:
      CHAT_HOST: server
      CHAT_PORT: "5555"
    networks: [frontend, downloads]
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - maven-cache:/root/.m2
    profiles: [tools]

  benchmark:
    <<: *app
    command: [benchmark, /reports/scaling.csv, "3", "8", "50"]
    network_mode: none
    volumes:
      - ./benchmarks:/reports
    profiles: [tools]

networks:
  frontend: {}
  backend:
    internal: true
  data:
    internal: true
  downloads: {}

volumes:
  chat-data:
  maven-cache:
